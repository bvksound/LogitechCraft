name: test-and-build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: CraftCrown-Windows.zip
          - os: macos-latest   # Apple Silicon (arm64) runner
            asset: CraftCrown-macOS-arm64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller pytest
      - name: Tests on this OS
        run: python -m pytest -q
      - run: pyinstaller --noconfirm craft_crown.spec
      - name: Check architecture (macOS)
        if: runner.os == 'macOS'
        run: |
          archs=$(lipo -archs dist/CraftCrown.app/Contents/MacOS/CraftCrown)
          echo "CraftCrown.app architecture: $archs"
          [[ " $archs " == *" arm64 "* ]]
      - name: Run the built app (macOS)
        if: runner.os == 'macOS'
        run: dist/CraftCrown.app/Contents/MacOS/CraftCrown --selftest selftest-out
      - name: Run the built app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\CraftCrown\CraftCrown.exe -ArgumentList "--selftest","selftest-out" -Wait -PassThru
          Get-Content selftest-out\selftest.txt
          exit $p.ExitCode
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-${{ runner.os }}
          path: selftest-out/
          if-no-files-found: ignore
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/CraftCrown -DestinationPath dist/${{ matrix.asset }}
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent CraftCrown.app ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*.zip
          generate_release_notes: true
